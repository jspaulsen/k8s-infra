# LAN-only: served by k3s's bundled Traefik (192.168.2.254), not the Cloudflare tunnel
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: vikunja
spec:
  ingressClassName: traefik
  rules:
    - host: vikunja.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 3456
